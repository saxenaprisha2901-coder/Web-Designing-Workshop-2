<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Factorial & Multiplication Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f9;
    }
    h1 {
      color: #333;
    }
    input, button {
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    #result, #table {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border: 1px solid #ccc;
      
    }
    table {
      border-collapse: collapse;
      width: 50%;
    }
    table, th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Factorial & Multiplication Table Generator</h1>
  
  <label for="number">Enter a number:</label>
  <input type="number" id="number" min="0">
  <button onclick="generate()">Generate</button>
  
  <div id="result"></div>
  <div id="table"></div>
  
  <script>
    function generate() {
      let num = document.getElementById("number").value;
      num = parseInt(num);
      
      if (isNaN(num) || num < 0) {
        document.getElementById("result").innerHTML = "Please enter a valid non-negative number.";
        document.getElementById("table").innerHTML = " ";
        return;
      }
      
      
      let factorial = 1;
      for (let i = 1; i <= num; i++) {
        factorial *= i;
      }
      document.getElementById("result").innerHTML = `<strong>Factorial of ${num}:</strong> ${factorial}`;
      
      
      let tableHTML = "<h3>Multiplication Table:</h3><table><tr><th>Expression</th><th>Result</th></tr>";
      for (let i = 1; i <= 10; i++) {
        tableHTML += `<tr><td>${num} × ${i}</td><td>${num * i}</td></tr>`;
      }
      tableHTML += "</table>";
      document.getElementById("table").innerHTML = tableHTML;
    }
  </script>
</body>
</html>
