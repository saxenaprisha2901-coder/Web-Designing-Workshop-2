<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Style UI</title>

<style>


.card {
    background: rgba(0,0,0,0.7);
    padding: 15px;
    text-align: center;
    border: 3px solid #2d2d2d;
    width: 150px;
    transition: 0.3s ease;
    cursor: pointer;
}


.card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px #00ff00;
}


.card button {
    padding: 5px 10px;
    transition: 0.3s;
    cursor: pointer;
}

.card button:hover {
    background: #00aa00;
    color: white;
}

</style>

</head>


<body style="
    margin:0;
    height:200vh;
    background:url('https://wallpapercave.com/wp/wp2890577.jpg') no-repeat center center/cover;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Courier New', monospace;
">

<div style="
    background:rgba(0,0,0,0.6);
    padding:20px 40px;
    text-align:center;
    border:4px solid #2d2d2d;
    box-shadow:0 0 15px black;
    margin-bottom:40px;
">
    <h1 style="
        font-size:40px;
        color:white;
        text-shadow:3px 3px black;
        margin-bottom:20px;
        letter-spacing:4px;
    ">
        MINECRAFT
    </h1>

    <div style="
        display:flex;
        flex-direction:column;
        gap:10px;
    ">
        <button style="padding:10px 30px;font-size:16px;background:linear-gradient(#6b6b6b,#3b3b3b);color:white;border:3px solid #1f1f1f;cursor:pointer;">Singleplayer</button>
        <button style="padding:10px 30px;font-size:16px;background:linear-gradient(#6b6b6b,#3b3b3b);color:white;border:3px solid #1f1f1f;cursor:pointer;">Multiplayer</button>
        <button style="padding:10px 30px;font-size:16px;background:linear-gradient(#6b6b6b,#3b3b3b);color:white;border:3px solid #1f1f1f;cursor:pointer;">Options</button>
        <button style="padding:10px 30px;font-size:16px;background:linear-gradient(#6b6b6b,#3b3b3b);color:white;border:3px solid #1f1f1f;cursor:pointer;">Quit Game</button>
    </div>
</div>

    padding:20px;
    border:4px solid #444;

        flex-direction:column;
        gap:10px;
    ">

            🎮 Minecraft

        <div style="background:#333;padding:15px;color:white;cursor:pointer;">
            🔥 Minecraft Dungeons
        </div>

        <div style="background:#333;padding:15px;color:white;cursor:pointer;">
            💎 Minecraft Legends
        </div>

        <div style="background:#333;padding:15px;color:white;cursor:pointer;">
            📘 Minecraft Education
        </div>

    </div>

    
    <div style="
        width:70%;
        padding-left:20px;
        display:flex;
        flex-direction:column;
        align-items:center;
    ">

        <img src="https://imgs.search.brave.com/XNa3I68I9YSEaNs3JRe33tVhQREDruFAydQr0JpvQUs/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnl0/aW1nLmNvbS92aV93/ZWJwL3p0Tm9CSTBt/X1AwL21heHJlc2Rl/ZmF1bHQud2VicA"

            border:2px solid white;
            cursor:pointer;

</section>
